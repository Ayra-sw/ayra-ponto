<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ayra Ponto: controle de jornada e ponto eletrônico simples para empresas que estão crescendo." />
    <meta name="theme-color" content="#1B2A47" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2A47'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23D2AE5E' stroke-width='2.5'/%3E%3Cpath d='M16 11v5l3 2' fill='none' stroke='%23D2AE5E' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Ayra Ponto</title>
    <script>
      // aplica o tema antes de a página aparecer, para não piscar
      try {
        var t = localStorage.getItem('ayra-theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
